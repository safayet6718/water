<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#f8fafc"/>
  <!-- Droplet outline with gradient -->
  <path d="M256 70 C256 70 120 220 120 330 C120 405 181 466 256 466 C331 466 392 405 392 330 C392 220 256 70 256 70 Z" fill="url(#waterGrad)" filter="url(#shadow)"/>
  
  <!-- Stylized QR inside water droplet -->
  <rect x="180" y="240" width="46" height="46" rx="8" fill="white" />
  <rect x="194" y="254" width="18" height="18" rx="3" fill="#0284c7" />

  <rect x="286" y="240" width="46" height="46" rx="8" fill="white" />
  <rect x="300" y="254" width="18" height="18" rx="3" fill="#0284c7" />

  <rect x="180" y="346" width="46" height="46" rx="8" fill="white" />
  <rect x="194" y="360" width="18" height="18" rx="3" fill="#0284c7" />

  <!-- QR decorative bits -->
  <rect x="250" y="250" width="16" height="16" rx="4" fill="white" />
  <rect x="250" y="290" width="30" height="16" rx="4" fill="white" />
  <rect x="250" y="330" width="16" height="30" rx="4" fill="white" />
  <rect x="286" y="310" width="46" height="16" rx="4" fill="white" />
